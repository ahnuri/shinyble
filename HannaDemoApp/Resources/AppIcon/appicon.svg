<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0A84FF"/>

  <!-- Title: Hanna -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="90"
        font-weight="600"
        fill="white">
    Hanna
  </text>

  <!-- Subtitle: ShinyBLE -->
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="48"
        font-weight="400"
        fill="white"
        opacity="0.9">
    ShinyBLE
  </text>

  <!-- Optional BLE wave icon -->
  <g transform="translate(256,120)">
    <circle r="8" fill="white"/>
    <path d="M-40,0 Q0,-40 40,0" stroke="white" stroke-width="6" fill="none" opacity="0.8"/>
    <path d="M-60,0 Q0,-60 60,0" stroke="white" stroke-width="4" fill="none" opacity="0.5"/>
  </g>
</svg>